version: 2

sources:
  - name: synthetic_raw
    description: "Synthetic source data loaded by the capstone ingestion stage."
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('DBT_RAW_DATASET', 'healthcare_capstone_raw') }}"
    tables:
      - name: patients
        columns:
          - name: patient_id
            tests: [not_null, unique]
      - name: encounters
        columns:
          - name: encounter_id
            tests: [not_null, unique]
      - name: clinical_events
        columns:
          - name: event_id
            tests: [not_null, unique]
      - name: claims
        columns:
          - name: claim_id
            tests: [not_null, unique]
      - name: _ingestion_runs
        loaded_at_field: started_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        identifier: _ingestion_runs
        description: "Audit log of ingestion runs written by the atomic BigQuery loader."
        columns:
          - name: run_id
            tests: [not_null, unique]
          - name: started_at
            tests: [not_null]
          - name: status
            tests:
              - not_null
              - accepted_values:
                  values: ['SUCCESS', 'FAILED']



