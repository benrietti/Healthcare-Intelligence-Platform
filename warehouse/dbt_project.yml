name: healthcare_capstone
version: "1.0.0"
config-version: 2

profile: healthcare_capstone

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  healthcare_capstone:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  healthcare_capstone:
    bed_milestones:
      +column_types:
        admission_ts: timestamp
        discharge_ts: timestamp
        administrative_discharge_ts: timestamp
        transport_departure_ts: timestamp
        cleaning_complete_ts: timestamp
        ed_arrival_ts: timestamp
        ed_departure_ts: timestamp
